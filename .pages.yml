media:
  - name: images
    label: Imágenes del sitio
    input: public/images
    output: /images
    rename: safe
    categories: [image]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Contenido: crear {path}"
      update: "Contenido: actualizar {path}"
      delete: "Contenido: eliminar {path}"
      rename: "Contenido: renombrar {oldPath} a {newPath}"

content:
  - name: serviceVisibility
    label: Activar o desactivar servicios
    type: file
    path: src/data/service-visibility.json
    format: json
    operations:
      delete: false
    fields:
      - { name: drones, label: Mostrar Drones, type: boolean, required: true }
      - { name: desarrolloWeb, label: Mostrar Desarrollo web, type: boolean, required: true }
      - name: soporteTecnico
        label: Mostrar Soporte técnico
        type: boolean
        required: true
        description: Al apagarlo se oculta del menú, inicio, formularios y deja de publicarse su página.
      - { name: licenciasSoftware, label: Mostrar Software y licencias, type: boolean, required: true }

  - name: business
    label: Datos de la empresa
    type: file
    path: src/data/business.json
    format: json
    operations:
      delete: false
    fields:
      - name: legalName
        label: Razón social o titular
        type: string
      - name: ruc
        label: RUC
        type: string
        pattern:
          regex: "^$|^[0-9]{11}$"
          message: Ingresa 11 dígitos o deja el campo vacío.
      - name: contact
        label: Contacto
        type: object
        fields:
          - { name: email, label: Correo, type: string }
          - { name: phone, label: Teléfono visible, type: string }
          - name: whatsapp
            label: WhatsApp
            type: string
            description: Solo números con código de país, por ejemplo 51987654321.
            pattern:
              regex: "^$|^[0-9]{9,15}$"
              message: Usa solo números, entre 9 y 15 dígitos.
          - { name: area, label: Ciudad o zona de atención, type: string }
          - { name: address, label: Dirección pública, type: string }
          - { name: hours, label: Horario, type: string }
      - name: social
        label: Redes sociales
        type: object
        fields:
          - { name: facebook, label: Facebook, type: string }
          - { name: instagram, label: Instagram, type: string }
          - { name: tiktok, label: TikTok, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: youtube, label: YouTube, type: string }
      - name: support
        label: Modalidad de soporte
        type: object
        fields:
          - { name: onsite, label: Atención presencial, type: boolean }
          - { name: remote, label: Atención remota, type: boolean }

  - name: home
    label: Página de inicio
    type: file
    path: src/data/home.json
    format: json
    operations:
      delete: false
    fields:
      - { name: badge, label: Etiqueta superior, type: string, required: true }
      - { name: title, label: Título principal, type: string, required: true }
      - { name: titleAccent, label: Parte destacada del título, type: string, required: true }
      - { name: lead, label: Introducción, type: text, required: true }
      - { name: projectsEyebrow, label: Etiqueta de proyectos, type: string, required: true }
      - { name: projectsTitle, label: Título de proyectos, type: string, required: true }
      - { name: projectsLead, label: Texto de proyectos, type: text, required: true }
      - { name: aboutEyebrow, label: Etiqueta de empresa, type: string, required: true }
      - { name: aboutTitle, label: Título de empresa, type: string, required: true }
      - { name: aboutLead, label: Texto de empresa, type: text, required: true }
      - { name: aboutCta, label: Texto del botón final, type: string, required: true }

  - name: webDevelopment
    label: Página de desarrollo web
    type: file
    path: src/data/web-development.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero
        label: Primera pantalla
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta superior, type: string, required: true }
          - { name: title, label: Título principal, type: string, required: true }
          - { name: lead, label: Introducción, type: text, required: true }
          - { name: ctaLabel, label: Texto del botón, type: string, required: true }
          - { name: signals, label: Beneficios cortos, type: string, list: true, required: true }
      - name: showcase
        label: Vistas del producto digital
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label} · {title}"
        fields:
          - { name: id, label: Identificador, type: string, required: true }
          - { name: label, label: Pestaña, type: string, required: true }
          - { name: eyebrow, label: Categoría, type: string, required: true }
          - { name: title, label: Título, type: string, required: true }
          - { name: metric, label: Capacidades, type: string, required: true }
      - name: solutions
        label: Tres soluciones comerciales
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{number} · {title} · {price}"
        fields:
          - { name: id, label: Identificador, type: string, required: true }
          - { name: number, label: Número, type: string, required: true }
          - { name: eyebrow, label: Categoría, type: string, required: true }
          - { name: title, label: Nombre, type: string, required: true }
          - { name: description, label: Descripción, type: text, required: true }
          - { name: price, label: Precio visible, type: string, required: true }
          - { name: timing, label: Tiempo estimado, type: string, required: true }
          - name: icon
            label: Ícono
            type: select
            required: true
            options:
              values:
                - { label: Diseño web, value: layout }
                - { label: Flujo de trabajo, value: workflow }
                - { label: Sistema, value: cpu }
          - { name: includes, label: Incluye, type: string, list: true, required: true }
      - name: demos
        label: Demostraciones conceptuales
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label} · {title}"
        fields:
          - { name: id, label: Identificador, type: string, required: true }
          - { name: label, label: Sector, type: string, required: true }
          - { name: title, label: Nombre de la demostración, type: string, required: true }
          - { name: description, label: Descripción, type: text, required: true }
          - { name: features, label: Funciones destacadas, type: string, list: true, required: true }
      - name: process
        label: Proceso de trabajo
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Paso, type: string, required: true }
          - { name: text, label: Explicación, type: text, required: true }
      - name: cta
        label: Llamada final
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string, required: true }
          - { name: title, label: Título, type: string, required: true }
          - { name: text, label: Explicación, type: text, required: true }
          - { name: label, label: Texto del botón, type: string, required: true }
      - { name: priceNote, label: Nota sobre precios, type: text, required: true }

  - name: droneQuote
    label: Tarifas y cotizaciones de drones
    type: file
    path: src/data/drone-quote.json
    format: json
    operations:
      delete: false
    fields:
      - name: document
        label: Configuración del documento
        type: object
        fields:
          - { name: prefix, label: Prefijo de cotización, type: string, required: true }
          - { name: nextNumber, label: Próximo número, type: number, required: true }
          - { name: currency, label: Código de moneda, type: string, required: true }
          - { name: currencySymbol, label: Símbolo de moneda, type: string, required: true }
          - { name: depositPercent, label: Adelanto (%), type: number, required: true }
          - { name: minimumNoticeDays, label: Anticipación mínima (días), type: number, required: true }
          - { name: validityDays, label: Vigencia de la cotización (días), type: number, required: true }
      - name: overview
        label: Primera pantalla de Drones
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta superior, type: string, required: true }
          - name: items
            label: Tres servicios destacados
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{number} · {title}"
            fields:
              - { name: id, label: Identificador, type: string, required: true }
              - { name: number, label: Número, type: string, required: true }
              - { name: eyebrow, label: Categoría, type: string, required: true }
              - { name: title, label: Nombre del servicio, type: string, required: true }
              - { name: description, label: Descripción, type: text, required: true }
              - name: icon
                label: Ícono
                type: select
                required: true
                options:
                  values:
                    - { label: Cámara, value: camera }
                    - { label: Fotogrametría, value: photogrammetry }
                    - { label: Dron, value: drone }
              - { name: image, label: Imagen inferior, type: image, required: true }
              - { name: imageAlt, label: Descripción accesible de la imagen, type: string, required: true }
              - name: imageFit
                label: Ajuste de la imagen
                type: select
                required: true
                options:
                  values:
                    - { label: Cubrir el área, value: cover }
                    - { label: Mostrar completa, value: contain }
              - { name: imageCaption, label: Etiqueta sobre la imagen, type: string, required: true }
              - { name: tags, label: Características cortas, type: string, list: true, required: true }
      - name: customBuild
        label: Armado de drones FPV por encargo
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta superior, type: string, required: true }
          - { name: name, label: Nombre del producto, type: string, required: true }
          - { name: description, label: Descripción, type: text, required: true }
          - { name: image, label: Ruta de la imagen, type: string, required: true }
          - { name: imageAlt, label: Descripción accesible de la imagen, type: string, required: true }
          - { name: priceLabel, label: Texto de inversión, type: string, required: true }
          - { name: paymentLabel, label: Texto del adelanto, type: string, required: true }
          - { name: tags, label: Perfiles o categorías, type: string, list: true, required: true }
          - { name: includes, label: Qué incluye, type: string, list: true, required: true }
          - name: process
            label: Proceso de compra y armado
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Paso, type: string, required: true }
              - { name: text, label: Explicación, type: text, required: true }
          - { name: terms, label: Condiciones comerciales, type: string, list: true, required: true }
          - { name: ctaLabel, label: Texto del botón, type: string, required: true }
          - { name: whatsappMessage, label: Mensaje de WhatsApp, type: text, required: true }
      - name: packages
        label: Paquetes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {priceLabel}"
        fields:
          - { name: id, label: Identificador, type: string, required: true }
          - { name: eyebrow, label: Categoría corta, type: string, required: true }
          - { name: name, label: Nombre, type: string, required: true }
          - { name: price, label: Precio numérico, type: number, required: true }
          - name: unit
            label: Modalidad
            type: select
            required: true
            options:
              values:
                - { label: Por hora, value: hora }
                - { label: Por proyecto, value: proyecto }
          - { name: priceLabel, label: Precio visible, type: string, required: true }
          - { name: timing, label: Duración o modalidad, type: string, required: true }
          - { name: support, label: Entrega principal, type: string, required: true }
          - { name: description, label: Descripción, type: text, required: true }
          - { name: includes, label: Incluye, type: string, list: true, required: true }
          - { name: featured, label: Mostrar como recomendado, type: boolean }
      - name: addons
        label: Servicios adicionales
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · S/ {price}"
        fields:
          - { name: id, label: Identificador, type: string, required: true }
          - { name: name, label: Nombre, type: string, required: true }
          - { name: description, label: Descripción, type: text, required: true }
          - { name: price, label: Precio, type: number, required: true }
          - { name: standardOnly, label: Solo para paquete estándar, type: boolean }
      - name: terms
        label: Términos y condiciones
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Título, type: string, required: true }
          - { name: text, label: Condición, type: text, required: true }
      - { name: note, label: Nota comercial final, type: text, required: true }

  - name: advanced
    label: Contenido avanzado
    type: group
    items:
      - name: services
        label: Servicios y precios
        type: file
        path: src/data/services.ts
        format: code
        operations:
          delete: false
      - name: licenses
        label: Catálogo de software
        type: file
        path: src/data/licenses.ts
        format: code
        operations:
          delete: false
      - name: projects
        label: Proyectos
        type: file
        path: src/data/projects.ts
        format: code
        operations:
          delete: false
      - name: faqs
        label: Preguntas frecuentes
        type: file
        path: src/data/faqs.ts
        format: code
        operations:
          delete: false
